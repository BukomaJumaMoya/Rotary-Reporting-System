name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Integration tests run against a real PostgreSQL. The alternative — mocking the
    # repository — would leave the lockout, the single-use token index and the guard
    # triggers untested, which is most of what this milestone is for.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dis_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      # NFR-1.2: 250 KB gzipped of initial JavaScript. A FAILURE, not a warning — members
      # pay per megabyte, and a warning is a number that drifts upwards for two years while
      # everybody agrees something should be done about it.
      - name: Payload budget
        run: npm run bundle:check

      # Fails on high and critical advisories only. Moderate findings in build-time
      # tooling are not worth a red pipeline on a Tuesday; raise this before launch.
      - name: Audit
        run: npm audit --audit-level=high
